<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Pet Dragon 🐉</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Playful Rounded Font -->
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Base ── */
    * { box-sizing: border-box; }
    body {
      font-family: 'Quicksand', 'Varela Round', sans-serif;
      background: linear-gradient(135deg, #FFDEE9 0%, #d4f5ff 50%, #B5FFFC 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Dragon SVG ── */
    #dragon-wrap {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #dragon-wrap:hover { transform: scale(1.05); }
    #dragon-wrap:active { transform: scale(0.94); }

    /* idle float */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-14px); }
    }
    #dragon-svg { animation: float 3s ease-in-out infinite; }

    /* click bounce */
    @keyframes bounce-click {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.18) rotate(-4deg); }
      60%  { transform: scale(0.92) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    #dragon-svg.clicked {
      animation: bounce-click 0.45s ease forwards;
    }

    /* wiggle blink */
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(-8deg) scale(1.08); }
      75%       { transform: rotate(8deg) scale(1.08); }
    }
    #dragon-svg.wiggle { animation: wiggle 0.5s ease forwards; }

    /* spin */
    @keyframes spin-once {
      from { transform: rotate(0deg) scale(1.1); }
      to   { transform: rotate(360deg) scale(1); }
    }
    #dragon-svg.spin { animation: spin-once 0.6s ease forwards; }

    /* ── Floating reaction emoji ── */
    .reaction-float {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      z-index: 999;
      animation: floatUp 1.1s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1;   transform: translateY(0)   scale(1); }
      80%  { opacity: 0.8; transform: translateY(-90px) scale(1.3); }
      100% { opacity: 0;   transform: translateY(-120px) scale(0.8); }
    }

    /* ── Particle burst ── */
    .particle {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 998;
      animation: burst 0.7s ease-out forwards;
    }
    @keyframes burst {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
    }

    /* ── Glassmorphism card ── */
    .glass {
      background: rgba(255,255,255,0.30);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255,255,255,0.45);
    }

    /* ── Level bar fill ── */
    #xp-fill {
      transition: width 0.4s cubic-bezier(.4,2,.6,1);
    }

    /* ── Reaction speech bubble ── */
    #speech-bubble {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #speech-bubble.show {
      opacity: 1 !important;
      transform: translateY(0) scale(1) !important;
    }

    /* ── Milestone pop ── */
    #milestone-toast {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* fire glow pulse on high combo */
    @keyframes fire-glow {
      0%, 100% { filter: drop-shadow(0 0 8px #ff6b35) drop-shadow(0 0 20px #ffd700); }
      50%       { filter: drop-shadow(0 0 20px #ff6b35) drop-shadow(0 0 40px #ffd700); }
    }
    #dragon-svg.on-fire { animation: fire-glow 0.6s ease-in-out infinite; }
  </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen px-4 py-10 select-none">

  <!-- ── Title ── -->
  <h1 class="text-4xl font-bold text-pink-500 tracking-wide mb-1 drop-shadow-sm">
    🐉 My Pet Dragon
  </h1>
  <p id="dragon-name" class="text-purple-400 font-semibold text-lg mb-6">Ember</p>

  <!-- ── Stats Row ── -->
  <div class="flex gap-4 mb-6 flex-wrap justify-center">
    <!-- Clicks -->
    <div class="glass rounded-full px-6 py-3 flex items-center gap-2 shadow-lg">
      <span class="text-2xl">🖱️</span>
      <div>
        <p class="text-xs text-purple-400 font-semibold uppercase tracking-widest">Pets</p>
        <p id="click-count" class="text-2xl font-bold text-purple-600">0</p>
      </div>
    </div>
    <!-- Level -->
    <div class="glass rounded-full px-6 py-3 flex items-center gap-2 shadow-lg">
      <span class="text-2xl">⭐</span>
      <div>
        <p class="text-xs text-yellow-400 font-semibold uppercase tracking-widest">Level</p>
        <p id="level-display" class="text-2xl font-bold text-yellow-500">1</p>
      </div>
    </div>
    <!-- Combo -->
    <div class="glass rounded-full px-6 py-3 flex items-center gap-2 shadow-lg">
      <span class="text-2xl">🔥</span>
      <div>
        <p class="text-xs text-orange-400 font-semibold uppercase tracking-widest">Combo</p>
        <p id="combo-display" class="text-2xl font-bold text-orange-500">x1</p>
      </div>
    </div>
  </div>

  <!-- ── XP Bar ── -->
  <div class="glass w-full max-w-xs rounded-full h-4 mb-8 shadow-inner overflow-hidden px-1 flex items-center">
    <div id="xp-fill" class="h-2.5 rounded-full bg-gradient-to-r from-pink-400 to-purple-400 w-0"></div>
  </div>

  <!-- ── Dragon + Speech Bubble ── -->
  <div class="relative flex flex-col items-center">

    <!-- Speech Bubble -->
    <div id="speech-bubble"
         class="glass rounded-2xl px-5 py-2 text-center text-sm font-semibold text-purple-700 shadow-md mb-4
                opacity-0 scale-90 pointer-events-none"
         style="max-width:220px; transform: translateY(4px) scale(0.9);">
      <span id="speech-text">Click me! 🐾</span>
      <div class="absolute left-1/2 -bottom-2 -translate-x-1/2 w-0 h-0
                  border-l-8 border-r-8 border-t-8
                  border-l-transparent border-r-transparent border-t-white/50"></div>
    </div>

    <!-- Dragon clickable area -->
    <div id="dragon-wrap" class="aspect-square w-60 sm:w-72">
      <!-- Minimalist SVG Dragon -->
      <svg id="dragon-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg"
           class="w-full h-full drop-shadow-xl" aria-label="Pet Dragon Ember">

        <!-- Shadow / ground -->
        <ellipse cx="100" cy="210" rx="48" ry="8" fill="rgba(180,120,255,0.18)" />

        <!-- Tail -->
        <path d="M 68 170 Q 30 200 45 215 Q 55 225 65 210 Q 72 195 80 180"
              fill="#a78bfa" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" />
        <polygon points="45,215 38,225 52,218" fill="#c4b5fd" />

        <!-- Wings (back) -->
        <path d="M 80 100 Q 20 60 10 90 Q 18 120 70 115"
              fill="#f9a8d4" stroke="#ec4899" stroke-width="1.5" opacity="0.85"/>
        <path d="M 120 100 Q 180 60 190 90 Q 182 120 130 115"
              fill="#f9a8d4" stroke="#ec4899" stroke-width="1.5" opacity="0.85"/>

        <!-- Body -->
        <ellipse cx="100" cy="155" rx="38" ry="45" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>

        <!-- Belly -->
        <ellipse cx="100" cy="165" rx="22" ry="28" fill="#c4b5fd" opacity="0.7"/>

        <!-- Neck -->
        <rect x="84" y="98" width="32" height="30" rx="16" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>

        <!-- Head -->
        <ellipse cx="100" cy="88" rx="34" ry="30" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>

        <!-- Horns -->
        <polygon points="82,65 76,42 88,62" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
        <polygon points="118,65 124,42 112,62" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>

        <!-- Eyes -->
        <!-- Left eye white -->
        <ellipse cx="88" cy="86" rx="9" ry="10" fill="white"/>
        <!-- Right eye white -->
        <ellipse cx="112" cy="86" rx="9" ry="10" fill="white"/>
        <!-- Left pupil -->
        <circle id="pupil-left" cx="89" cy="87" r="5.5" fill="#4c1d95"/>
        <!-- Right pupil -->
        <circle id="pupil-right" cx="113" cy="87" r="5.5" fill="#4c1d95"/>
        <!-- Eye shine left -->
        <circle cx="91" cy="84" r="2" fill="white" opacity="0.9"/>
        <circle cx="114" cy="84" r="2" fill="white" opacity="0.9"/>

        <!-- Blush -->
        <ellipse cx="80" cy="96" rx="8" ry="5" fill="#fbcfe8" opacity="0.6"/>
        <ellipse cx="120" cy="96" rx="8" ry="5" fill="#fbcfe8" opacity="0.6"/>

        <!-- Smile -->
        <path id="dragon-mouth" d="M 92 100 Q 100 108 108 100"
              fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Nostrils -->
        <circle cx="96" cy="96" r="2" fill="#7c3aed" opacity="0.5"/>
        <circle cx="104" cy="96" r="2" fill="#7c3aed" opacity="0.5"/>

        <!-- Feet -->
        <ellipse cx="76" cy="197" rx="16" ry="8" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
        <ellipse cx="124" cy="197" rx="16" ry="8" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
        <!-- Toes left -->
        <circle cx="64" cy="197" r="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
        <circle cx="72" cy="201" r="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
        <circle cx="82" cy="202" r="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
        <!-- Toes right -->
        <circle cx="136" cy="197" r="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
        <circle cx="128" cy="201" r="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
        <circle cx="118" cy="202" r="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>

        <!-- Spikes on back -->
        <polygon points="90,115 85,100 95,112" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
        <polygon points="100,112 96,96 104,110" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
        <polygon points="110,115 105,100 115,112" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
      </svg>
    </div>
  </div>

  <!-- ── Hint ── -->
  <p class="text-purple-300 text-sm mt-5 font-medium animate-pulse">tap to pet! ✨</p>

  <!-- ── Milestone Toast ── -->
  <div id="milestone-toast"
       class="fixed top-8 left-1/2 -translate-x-1/2 glass rounded-2xl px-8 py-4
              text-center text-purple-700 font-bold text-lg shadow-2xl
              opacity-0 pointer-events-none z-50"
       style="transform: translate(-50%, -20px);">
    <span id="milestone-text">🎉 Level Up!</span>
  </div>

  <!-- ── Footer ── -->
  <p class="text-purple-200 text-xs mt-8 font-medium">made with 💜 for dragon lovers</p>

<!-- ══════════════════════════════════════════
     VANILLA JS
══════════════════════════════════════════ -->
<script>
  /* ── State ── */
  let clicks  = 0;
  let combo   = 1;
  let xp      = 0;
  let level   = 1;
  let comboTimer = null;
  let speechTimer = null;
  let onFire  = false;

  /* XP needed per level (grows) */
  const xpForLevel = (lvl) => lvl * 20;

  /* ── DOM refs ── */
  const dragonWrap     = document.getElementById('dragon-wrap');
  const dragonSvg      = document.getElementById('dragon-svg');
  const clickCountEl   = document.getElementById('click-count');
  const levelDisplayEl = document.getElementById('level-display');
  const comboDisplayEl = document.getElementById('combo-display');
  const xpFill         = document.getElementById('xp-fill');
  const speechBubble   = document.getElementById('speech-bubble');
  const speechText     = document.getElementById('speech-text');
  const dragonMouth    = document.getElementById('dragon-mouth');
  const milestoneToast = document.getElementById('milestone-toast');
  const milestoneText  = document.getElementById('milestone-text');

  /* ── Reactions pool ── */
  const reactions = [
    { emoji: '💜', text: 'Purrrr~ 💜' },
    { emoji: '✨', text: 'Sparkleeee! ✨' },
    { emoji: '🔥', text: 'FIRE! 🔥' },
    { emoji: '🌟', text: 'You\'re my fav! 🌟' },
    { emoji: '😍', text: 'More pets please!' },
    { emoji: '🎵', text: '*happy dragon noises*' },
    { emoji: '💨', text: 'Breathe in... breathe out~' },
    { emoji: '🌈', text: 'Rainbow breath! 🌈' },
    { emoji: '🥺', text: 'Don\'t stop! 🥺' },
    { emoji: '😤', text: 'RAWR means I love you!' },
    { emoji: '🍭', text: 'Sweet as candy~ 🍭' },
    { emoji: '🫦', text: 'Teehee~ 🫦' },
    { emoji: '💫', text: 'Spinning with joy!' },
    { emoji: '🎀', text: 'You\'re a cutie! 🎀' },
    { emoji: '🥰', text: 'Best human ever! 🥰' },
    { emoji: '👑', text: 'My royal petter! 👑' },
    { emoji: '⚡', text: 'ZAP ZAP! ⚡' },
    { emoji: '🌙', text: 'Moonbeam kisses~' },
    { emoji: '🍄', text: 'Mushroom power! 🍄' },
    { emoji: '🐾', text: 'Paws up! 🐾' },
  ];

  /* Combo-specific reactions */
  const comboReactions = {
    5:  { emoji: '🔥', text: 'COMBO x5!! 🔥' },
    10: { emoji: '💥', text: 'MEGA COMBO! 💥' },
    20: { emoji: '🌋', text: 'UNSTOPPABLE!! 🌋' },
    50: { emoji: '🌌', text: 'COSMIC POWER! 🌌' },
  };

  /* Dragon animation states */
  const anims = ['clicked', 'wiggle', 'spin'];

  /* Particle colors */
  const particleColors = ['#f9a8d4','#a78bfa','#fbbf24','#34d399','#60a5fa','#fb923c'];

  /* ── Helper: random int ── */
  const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ── Floating emoji ── */
  function spawnReactionFloat(x, y, emoji) {
    const el = document.createElement('span');
    el.className = 'reaction-float';
    el.textContent = emoji;
    el.style.left = (x - 16) + 'px';
    el.style.top  = (y - 16) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  /* ── Particle burst ── */
  function spawnParticles(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (360 / count) * i + rnd(-15, 15);
      const dist  = rnd(50, 110);
      const rad   = angle * Math.PI / 180;
      p.style.setProperty('--tx', `${Math.cos(rad) * dist}px`);
      p.style.setProperty('--ty', `${Math.sin(rad) * dist}px`);
      p.style.background = pick(particleColors);
      p.style.left = (x - 5) + 'px';
      p.style.top  = (y - 5) + 'px';
      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  /* ── Speech bubble ── */
  function showSpeech(text) {
    speechText.textContent = text;
    speechBubble.classList.add('show');
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => speechBubble.classList.remove('show'), 2200);
  }

  /* ── Milestone toast ── */
  function showMilestone(text) {
    milestoneText.textContent = text;
    milestoneToast.style.opacity = '1';
    milestoneToast.style.transform = 'translate(-50%, 0)';
    setTimeout(() => {
      milestoneToast.style.opacity = '0';
      milestoneToast.style.transform = 'translate(-50%, -20px)';
    }, 2200);
  }

  /* ── Dragon animation ── */
  function animateDragon(type) {
    dragonSvg.classList.remove(...anims, 'on-fire');
    void dragonSvg.offsetWidth; // reflow
    dragonSvg.classList.add(type);
    if (onFire) {
      setTimeout(() => dragonSvg.classList.add('on-fire'), 460);
    }
    dragonSvg.addEventListener('animationend', () => {
      dragonSvg.classList.remove(...anims);
      if (!onFire) dragonSvg.style.animation = '';
      // restore float after click anim
      if (!onFire) {
        dragonSvg.style.animation = 'float 3s ease-in-out infinite';
      }
    }, { once: true });
  }

  /* ── Update XP / Level bar ── */
  function updateXP(amount) {
    xp += amount;
    const needed = xpForLevel(level);
    const pct = Math.min((xp / needed) * 100, 100);
    xpFill.style.width = pct + '%';

    if (xp >= needed) {
      xp -= needed;
      level++;
      levelDisplayEl.textContent = level;
      xpFill.style.width = '0%';
      showMilestone(`⭐ Level ${level}! Ember is growing!`);
      // update bar for leftover xp
      setTimeout(() => {
        xpFill.style.width = Math.min((xp / xpForLevel(level)) * 100, 100) + '%';
      }, 400);
    }
  }

  /* ── Main click handler ── */
  dragonWrap.addEventListener('click', (e) => {
    clicks++;
    clickCountEl.textContent = clicks;

    /* Combo logic */
    combo++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => {
      combo = 1;
      comboDisplayEl.textContent = 'x1';
      onFire = false;
      dragonSvg.classList.remove('on-fire');
      dragonSvg.style.animation = 'float 3s ease-in-out infinite';
    }, 1500);

    comboDisplayEl.textContent = 'x' + combo;

    /* On-fire mode at combo 10+ */
    if (combo >= 10 && !onFire) {
      onFire = true;
      dragonSvg.classList.add('on-fire');
    }

    /* XP gain (combo multiplied) */
    const xpGain = Math.max(1, Math.floor(combo / 2));
    updateXP(xpGain);

    /* Pick reaction */
    let reaction;
    const comboKey = [50, 20, 10, 5].find(k => combo === k);
    if (comboKey) {
      reaction = comboReactions[comboKey];
    } else {
      reaction = pick(reactions);
    }

    /* Dragon animation */
    const animType = combo >= 10 ? 'spin' : pick(anims);
    animateDragon(animType);

    /* Speech bubble */
    showSpeech(reaction.text);

    /* Floating emoji & particles */
    const rect = dragonWrap.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2 + rnd(-30, 30);
    const cy = rect.top  + rect.height / 3 + rnd(-20, 20);
    spawnReactionFloat(cx, cy, reaction.emoji);
    if (combo >= 5) spawnParticles(cx, cy, combo >= 10 ? 14 : 8);

    /* Milestone clicks */
    const milestones = { 10:'🐣 First 10 pets!', 50:'💜 50 pets!', 100:'🔥 100 pets! Ember loves you!',
                         250:'🌟 250 pets! Dragon overlord!', 500:'🌌 500 pets! LEGENDARY!' };
    if (milestones[clicks]) showMilestone(milestones[clicks]);

    /* Cheek blush on low combos */
    const blushEls = document.querySelectorAll('ellipse[fill="#fbcfe8"]');
    blushEls.forEach(b => { b.style.opacity = '0.9'; });
    setTimeout(() => blushEls.forEach(b => { b.style.opacity = '0.6'; }), 600);
  });

  /* ── Eye tracking (mouse follow) ── */
  const pupilL = document.getElementById('pupil-left');
  const pupilR = document.getElementById('pupil-right');

  document.addEventListener('mousemove', (e) => {
    const rect = dragonSvg.getBoundingClientRect();
    const svgW = rect.width, svgH = rect.height;
    // Map mouse to SVG coords
    const mx = ((e.clientX - rect.left) / svgW) * 200;
    const my = ((e.clientY - rect.top)  / svgH) * 220;

    const movePupil = (el, ox, oy) => {
      const dx = mx - ox, dy = my - oy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const maxMove = 3;
      const factor = Math.min(maxMove / Math.max(dist, 1), 1);
      el.setAttribute('cx', (ox + dx * factor).toFixed(1));
      el.setAttribute('cy', (oy + dy * factor).toFixed(1));
    };
    movePupil(pupilL, 89, 87);
    movePupil(pupilR, 113, 87);
  });

  /* Initial greeting */
  setTimeout(() => showSpeech('Hi! I\'m Ember 🐉'), 800);
</script>
</body>
</html>
